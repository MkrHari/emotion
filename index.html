<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>How Do You Feel Today?</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07152f;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
            user-select: none;
        }

        .emotion {
            text-align: center;
            width: 100%;
        }

        .emoji {
            font-size: clamp(100px, 18vw, 220px);
            line-height: 1;
            margin-bottom: 30px;
        }

        .emotion-name {
            font-size: clamp(45px, 8vw, 100px);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .shuffle {
            animation: shuffle 0.08s infinite;
        }

        @keyframes shuffle {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body onclick="changeEmotion()">

    <div class="emotion" id="emotion">
        <div class="emoji">😊</div>
        <div class="emotion-name">HAPPY</div>
    </div>

    <script>

        const emotions = [

            { emoji: "😄", name: "HAPPY" },
            { emoji: "🤩", name: "EXCITED" },
            { emoji: "😎", name: "CONFIDENT" },
            { emoji: "🔥", name: "MOTIVATED" },
            { emoji: "😌", name: "CALM" },
            { emoji: "🥰", name: "GRATEFUL" },
            { emoji: "😊", name: "CONTENT" },
            { emoji: "😂", name: "AMUSED" },
            { emoji: "🥳", name: "JOYFUL" },
            { emoji: "😍", name: "INSPIRED" },
            { emoji: "💪", name: "DETERMINED" },
            { emoji: "🧠", name: "CURIOUS" },
            { emoji: "🤔", name: "THOUGHTFUL" },
            { emoji: "😇", name: "PEACEFUL" },

            { emoji: "😴", name: "TIRED" },
            { emoji: "🥱", name: "SLEEPY" },
            { emoji: "😐", name: "NEUTRAL" },
            { emoji: "😶", name: "QUIET" },
            { emoji: "😕", name: "UNSURE" },
            { emoji: "🤨", name: "DOUBTFUL" },
            { emoji: "😬", name: "NERVOUS" },
            { emoji: "😳", name: "AWKWARD" },

            { emoji: "😔", name: "SAD" },
            { emoji: "😞", name: "DISAPPOINTED" },
            { emoji: "😟", name: "WORRIED" },
            { emoji: "😰", name: "ANXIOUS" },
            { emoji: "😤", name: "FRUSTRATED" },
            { emoji: "😡", name: "ANGRY" },
            { emoji: "🤯", name: "OVERWHELMED" },
            { emoji: "🫠", name: "DRAINED" },
            { emoji: "🥶", name: "UNCOMFORTABLE" },

            { emoji: "🤪", name: "SILLY" },
            { emoji: "😜", name: "PLAYFUL" },
            { emoji: "🤗", name: "LOVED" },
            { emoji: "🫡", name: "READY" },
            { emoji: "🚀", name: "ENERGETIC" },
            { emoji: "⚡", name: "POWERFUL" },
            { emoji: "🌟", name: "POSITIVE" },
            { emoji: "💭", name: "DREAMY" },
            { emoji: "🫣", name: "SHY" },
            { emoji: "😮", name: "SURPRISED" }

        ];

        let lastEmotion = -1;

        function changeEmotion() {

            const emotionBox = document.getElementById("emotion");

            emotionBox.classList.add("shuffle");

            let count = 0;

            const shuffleInterval = setInterval(() => {

                let randomIndex;

                do {
                    randomIndex =
                        Math.floor(Math.random() * emotions.length);
                } while (randomIndex === lastEmotion);

                const randomEmotion = emotions[randomIndex];

                emotionBox.innerHTML = `
                    <div class="emoji">${randomEmotion.emoji}</div>
                    <div class="emotion-name">${randomEmotion.name}</div>
                `;

                count++;

                if (count >= 8) {

                    clearInterval(shuffleInterval);

                    let finalIndex;

                    do {
                        finalIndex =
                            Math.floor(Math.random() * emotions.length);
                    } while (finalIndex === lastEmotion);

                    lastEmotion = finalIndex;

                    const finalEmotion = emotions[finalIndex];

                    emotionBox.innerHTML = `
                        <div class="emoji">${finalEmotion.emoji}</div>
                        <div class="emotion-name">${finalEmotion.name}</div>
                    `;

                    emotionBox.classList.remove("shuffle");
                }

            }, 80);
        }

    </script>

</body>
</html>
